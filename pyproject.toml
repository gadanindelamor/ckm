[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ckm"
version = "0.1.0"
description = "Cohesive Knowledge Model — verification and integration for multi-device AI systems"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "gadanin.delamor" }
]
keywords = ["knowledge", "cohesion", "hopfield", "ai", "mcp", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "networkx>=3.0",
    # services/node_extractor.py importa TfidfVectorizer y la dependencia no
    # estaba declarada (CP0a, 13 oct). Siete parametros que deciden salen de
    # los defaults de esta libreria -- lowercase, strip_accents, norm,
    # smooth_idf, use_idf, sublinear_tf, min_df/max_df -- y el desempate de
    # max_features tambien. Corre 1.9.0.
    #
    # ~= y no >= (decide Opus, 13 oct): ">=" registraba un piso, no la version,
    # y lo medido vale para la linea 1.9.x. Una version nueva se adopta
    # MIDIENDO DE NUEVO, no por defecto.
    "scikit-learn~=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    # La suite se corre en paralelo (`pytest -n 4`, los 4 nucleos del
    # Codespace pago). Estaba instalado y NO declarado: un checkout limpio
    # no podia reproducir la forma en que se corre la suite, y "pasan 843"
    # dependia de un paquete que el repo no nombraba. Declarado el 22 oct 2026.
    #
    # `~=` y no `>=`, por el mismo criterio que `scikit-learn`: lo medido vale
    # para la linea 3.8.x. Una version nueva se adopta midiendo de nuevo.
    "pytest-xdist~=3.8.0",
    "matplotlib>=3.7",
]
viz = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/gadanindelamor"
Repository = "https://github.com/gadanindelamor/ckm"
Documentation = "https://github.com/gadanindelamor/ckm/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["ckm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
