[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ckm"
version = "0.1.0"
description = "Cohesive Knowledge Model — verification and integration for multi-device AI systems"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "gadanin.delamor" }
]
keywords = ["knowledge", "cohesion", "hopfield", "ai", "mcp", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "matplotlib>=3.7",
]
viz = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/gadanin/ckm"
Repository = "https://github.com/gadanin/ckm"
Documentation = "https://github.com/gadanin/ckm/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["ckm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
